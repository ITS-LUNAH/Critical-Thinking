    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .slide-container {
            max-width: 1200px;
            margin: 0 auto;
            height: calc(100vh - 120px);
            display: none;
            flex-direction: column;
            justify-content: space-between;
            animation: slideInRight 0.5s ease-out;
        }

        .slide-container.active {
            display: flex;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .slide {
            background: white;
            border-radius: 20px;
            padding: 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .slide-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            text-align: center;
        }

        .slide-subtitle {
            font-size: 1.5rem;
            color: #666;
            text-align: center;
            margin-bottom: 40px;
        }

        .slide-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #333;
        }

        .code-block {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 20px 0;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .diagram {
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
        }

        .game-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin: 15px 0;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .logic-flow {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .logic-box {
            background: #f0f4ff;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            color: #667eea;
        }

        .arrow {
            font-size: 2rem;
            color: #667eea;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .slide-counter {
            text-align: center;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 20px;
        }

        .feature-list {
            list-style: none;
            padding: 0;
        }

        .feature-list li {
            padding: 15px;
            margin: 10px 0;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            font-size: 1.05rem;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 15px;
            text-align: left;
            border: 1px solid #ddd;
        }

        .comparison-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
        }

        .comparison-table tr:nth-child(even) {
            background: #f9f9f9;
        }

        .icon {
            font-size: 3rem;
            text-align: center;
            margin: 20px 0;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .slide {
                padding: 40px 20px;
            }

            .slide-title {
                font-size: 2rem;
            }

            .two-column {
                grid-template-columns: 1fr;
            }

            .logic-flow {
                grid-template-columns: 1fr;
            }

            .arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>

        function renderSlide(index) {
            const container = document.getElementById('slides-container');
            const slide = slides[index];

            container.innerHTML = `
                <div class="slide-container active">
                    <div class="slide">
                        <h1 class="slide-title">${slide.title}</h1>
                        <h2 class="slide-subtitle">${slide.subtitle}</h2>
                        <div class="slide-content">
                            ${slide.content}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('current-slide').textContent = index + 1;
            document.getElementById('total-slides').textContent = slides.length;
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').disabled = index === slides.length - 1;

            // Highlight code blocks
            document.querySelectorAll('.code-block code').forEach((block) => {
                hljs.highlightElement(block);
            });
        }

        function nextSlide() {
            const current = parseInt(document.getElementById('current-slide').textContent) - 1;
            if (current < slides.length - 1) {
                renderSlide(current + 1);
            }
        }

        function previousSlide() {
            const current = parseInt(document.getElementById('current-slide').textContent) - 1;
            if (current > 0) {
                renderSlide(current - 1);
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') previousSlide();
        });

        // Initialize
        renderSlide(0);
    </script>
